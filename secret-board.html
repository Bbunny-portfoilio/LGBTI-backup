<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비밀글 게시판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Pretendard:wght@300;400;500;600&display=swap" rel="stylesheet">

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getFirestore, collection, addDoc, getDocs,
    doc, getDoc, updateDoc, deleteDoc, serverTimestamp, query, orderBy, where
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA5-r1UVTU5t8vr6GhnDJxFm5R7cp-UZVE",
    authDomain: "lgbti-0423.firebaseapp.com",
    projectId: "lgbti-0423",
    storageBucket: "lgbti-0423.firebasestorage.app",
    messagingSenderId: "171455513695",
    appId: "1:171455513695:web:83f185306f4d9a965847ea"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  

  // ── 전역 상태 ──
  let posts = [];
  let currentTags = [];
  let filterTag = null;
  let currentUser = null;
  let viewMode = 'list'; // 'list' | 'thumb'
  let editingPostId = null; // 수정 중인 글 ID

  // ── 유틸 ──
  function hashPassword(pw) {
    let h = 0;
    for (let i = 0; i < pw.length; i++) h = (Math.imul(31, h) + pw.charCodeAt(i)) | 0;
    return h.toString(36);
  }
  function formatDate(ts) {
    if (!ts) return "";
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    return d.toLocaleDateString("ko-KR", { year: "numeric", month: "2-digit", day: "2-digit" });
  }
  function el(id) { return document.getElementById(id); }
  function show(id) { el(id).style.display = "initial"; }
  function hide(id) { el(id).style.display = "none"; }
  function escapeHtml(s) {
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  // ── 태그 색상 ──
  const TAG_COLORS = [
    { bg:"#e8f4fd", text:"#1a6fa8", border:"#a8d4f0" },
    { bg:"#edf7ee", text:"#1e7a2e", border:"#a3d9ab" },
    { bg:"#fef3e2", text:"#9a5a00", border:"#f5c97a" },
    { bg:"#fde8f0", text:"#a0204e", border:"#f0a0c0" },
    { bg:"#ede8fd", text:"#4a27a8", border:"#c0aef5" },
    { bg:"#e8fdf8", text:"#0f7060", border:"#8ad8c8" },
    { bg:"#fde8e8", text:"#a02020", border:"#f0a0a0" },
    { bg:"#f0f0f0", text:"#444444", border:"#cccccc" },
  ];
  function tagColor(tag) {
    let h = 0;
    for (let i = 0; i < tag.length; i++) h = (Math.imul(31, h) + tag.charCodeAt(i)) | 0;
    return TAG_COLORS[Math.abs(h) % TAG_COLORS.length];
  }
  function tagBadgeHtml(tag, clickable = false) {
    const c = tagColor(tag);
    const active = filterTag === tag;
    const style = `background:${active ? c.text : c.bg};color:${active ? '#fff' : c.text};border:1px solid ${c.border};border-radius:20px;padding:2px 10px;font-size:0.75rem;font-weight:500;cursor:${clickable ? 'pointer' : 'default'};white-space:nowrap;transition:background 0.15s,color 0.15s;`;
    return `<span class="tag-badge" style="${style}" data-tag="${escapeHtml(tag)}">${escapeHtml(tag)}</span>`;
  }
  function getAllTags() {
    const set = new Set();
    posts.forEach(p => (p.tags || []).forEach(t => set.add(t)));
    return [...set];
  }

  // ── 헤더 업데이트 ──
  function updateHeader() {
    const loginBtn = el("header-login-btn");
    const userInfo = el("header-user-info");
    const userName = el("header-user-name");
    if (currentUser) {
      loginBtn.style.display = "none";
      userInfo.style.display = "flex";
      userName.textContent = currentUser.name + "님";
    } else {
      loginBtn.style.display = "flex";
      userInfo.style.display = "none";
    }
    // 글쓰기 버튼
    const writeBtn = el("write-btn");
    if (writeBtn) writeBtn.style.display = currentUser ? "" : "none";
  }

  // ── 로그인 모달 ──
  window.openLoginModal = () => {
    el("login-id").value = "";
    el("login-pw").value = "";
    el("login-error").textContent = "";
    el("login-modal-overlay").style.display = "flex";
    setTimeout(() => el("login-id").focus(), 50);
  };
  window.closeLoginModal = () => {
    el("login-modal-overlay").style.display = "none";
  };
  window.doLogin = async () => {
    const id = el("login-id").value.trim();
    const pw = el("login-pw").value;
    if (!id || !pw) { el("login-error").textContent = "아이디와 비밀번호를 입력하세요."; return; }

    const btn = el("login-submit-btn");
    btn.disabled = true; btn.textContent = "로그인 중...";
    el("login-error").textContent = "";

    try {
      const q = query(collection(db, "members"), where("userId", "==", id));
      const snap = await getDocs(q);
      if (snap.empty) { el("login-error").textContent = "아이디 또는 비밀번호가 틀렸습니다."; return; }
      const member = snap.docs[0].data();
      if (member.passwordHash !== hashPassword(pw)) {
        el("login-error").textContent = "아이디 또는 비밀번호가 틀렸습니다."; return;
      }
      currentUser = { id: member.userId, name: member.name || member.userId };
      window.closeLoginModal();
      updateHeader();
      renderTagFilter();
      renderList();
    } catch (e) {
      el("login-error").textContent = "오류: " + e.message;
    } finally {
      btn.disabled = false; btn.textContent = "로그인";
    }
  };
  window.doLogout = () => {
    currentUser = null;
    updateHeader();
    renderList();
  };

  // ── 글 목록 ──
  async function loadPosts() {
    el("list-loading").style.display = "flex";
    el("post-list").innerHTML = "";
    try {
      const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
      const snap = await getDocs(q);
      posts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderTagFilter();
      renderList();
    } catch (e) {
      el("list-loading").innerHTML = `<span style="color:#c0392b">불러오기 실패: ${e.message}</span>`;
    }
  }

  function renderTagFilter() {
    const allTags = getAllTags();
    const wrap = el("tag-filter-wrap");
    if (allTags.length === 0) { wrap.innerHTML = ""; return; }
    wrap.innerHTML = `
      <span class="tag-filter-label">태그 필터:</span>
      <span class="tag-badge" style="cursor:pointer;border-radius:20px;padding:2px 10px;font-size:0.75rem;font-weight:500;background:${filterTag === null ? '#1e1812' : '#f0ebe0'};color:${filterTag === null ? '#f0e8d0' : '#7a6848'};border:1px solid ${filterTag === null ? '#1e1812' : '#d0c4ae'}" data-tag="">전체</span>
      ${allTags.map(t => tagBadgeHtml(t, true)).join("")}
    `;
    wrap.querySelectorAll(".tag-badge").forEach(b => {
      b.addEventListener("click", () => {
        filterTag = b.dataset.tag || null;
        renderTagFilter();
        renderList();
      });
    });
  }

  // 썸네일: thumbnail 필드 우선, 없으면 content 첫 img 태그에서 추출
  function extractThumb(post) {
    if (post.thumbnail) return post.thumbnail;
    if (!post.content) return null;
    const m = post.content.match(/<img[^>]+src=["']([^"']+)["']/i);
    return m ? m[1] : null;
  }
  // 글 내용에서 텍스트만 추출 (태그 제거)
  function stripHtml(html) {
    const d = document.createElement("div");
    d.innerHTML = html;
    return d.textContent || d.innerText || "";
  }

  window.setViewMode = (mode) => {
    viewMode = mode;
    el("view-btn-list").classList.toggle("active", mode === "list");
    el("view-btn-thumb").classList.toggle("active", mode === "thumb");
    el("board-header-row").style.display = mode === "list" ? "" : "none";
    renderList();
  };

  function renderList() {
    const container = el("post-list");
    el("list-loading").style.display = "none";
    const filtered = filterTag ? posts.filter(p => (p.tags || []).includes(filterTag)) : posts;
    if (filtered.length === 0) {
      container.innerHTML = `<div class="empty-state"><span class="lock-icon">📭</span><p>${filterTag ? `'${escapeHtml(filterTag)}' 태그의 글이 없습니다` : '아직 등록된 글이 없습니다'}</p></div>`;
      return;
    }
    if (viewMode === "thumb") {
      container.className = "thumb-grid";
      container.innerHTML = filtered.map((p) => {
        const tagsHtml = (p.tags || []).map(t => tagBadgeHtml(t, false)).join(" ");
        const isSecret = !!p.passwordHash;
        const canOpen = true;
        const thumb = (!isSecret || currentUser) ? extractThumb(p) : null;
        const excerpt = (!isSecret || currentUser) ? stripHtml(p.content).slice(0, 80) : "🔒 비밀번호를 입력하면 열람할 수 있어요";
        return `
          <div class="thumb-card ${canOpen ? 'clickable' : 'locked-row'}" ${canOpen ? `onclick="openPost('${p.id}')"` : ''}>
            <div class="thumb-img-wrap">
              ${thumb
                ? `<img src="${thumb}" alt="썸네일" onerror="this.parentElement.innerHTML='<div class=thumb-no-img>🖼️</div>'">`
                : `<div class="thumb-no-img">${isSecret && !currentUser ? '🔒' : '📄'}</div>`}
            </div>
            <div class="thumb-body">
              <div class="thumb-title">${escapeHtml(p.title)}</div>
              <div class="thumb-excerpt">${escapeHtml(excerpt)}</div>
              <div class="thumb-footer">
                <span class="thumb-date">${formatDate(p.createdAt)}</span>
              </div>
            </div>
          </div>
        `;
      }).join("");
    } else {
      container.className = "";
      container.innerHTML = filtered.map((p, i) => {
        const tagsHtml = (p.tags || []).map(t => tagBadgeHtml(t, false)).join(" ");
        const isSecret = !!p.passwordHash;
        const canOpen = true;
        return `
          <div class="post-row ${canOpen ? 'clickable' : 'locked-row'}" ${canOpen ? `onclick="openPost('${p.id}')"` : ''}>
            <span class="post-num">${filtered.length - i}</span>
            <span class="post-secret-badge">${isSecret ? (currentUser ? '🔓' : '🔑') : '📄'}</span>
            <span class="post-title-wrap">
              <span class="post-title-text">${escapeHtml(p.title)}</span>
              ${tagsHtml ? `<span class="post-tags">${tagsHtml}</span>` : ""}
            </span>
            <span class="post-date">${formatDate(p.createdAt)}</span>
          </div>
        `;
      }).join("");
    }
  }

  // ── 태그 입력 ──
  window.addTag = () => {
    const input = el("tag-input");
    const raw = input.value.trim().replace(/^#+/, "");
    if (!raw) return;
    if (currentTags.includes(raw)) { input.value = ""; return; }
    if (currentTags.length >= 5) { el("write-error").textContent = "태그는 최대 5개까지 추가할 수 있어요."; return; }
    currentTags.push(raw);
    input.value = "";
    el("write-error").textContent = "";
    renderWriteTags();
  };
  window.removeTag = (tag) => {
    currentTags = currentTags.filter(t => t !== tag);
    renderWriteTags();
  };
  function renderWriteTags() {
    const wrap = el("write-tags-display");
    wrap.innerHTML = currentTags.map(t => {
      const c = tagColor(t);
      return `<span style="background:${c.bg};color:${c.text};border:1px solid ${c.border};border-radius:20px;padding:2px 10px;font-size:0.78rem;font-weight:500;display:inline-flex;align-items:center;gap:5px;">
        ${escapeHtml(t)}
        <span onclick="removeTag('${escapeHtml(t)}')" style="cursor:pointer;font-size:0.85rem;line-height:1;opacity:0.7;">✕</span>
      </span>`;
    }).join("");
  }

  // ── 탭 전환 ──
  window.switchTab = (tab) => {
    if (tab === 'preview') {
      const html = el("write-content").value;
      el("html-preview").innerHTML = html;
      el("editor-write-area").style.display = "none";
      el("editor-preview-area").style.display = "";
      el("tab-write").classList.remove("active");
      el("tab-preview").classList.add("active");
    } else {
      el("editor-write-area").style.display = "";
      el("editor-preview-area").style.display = "none";
      el("tab-write").classList.add("active");
      el("tab-preview").classList.remove("active");
    }
  };

  // ── 썸네일 미리보기 ──
  window.previewThumbnail = () => {
    const url = el("write-thumbnail").value.trim();
    const img = el("thumb-preview-img");
    if (url) {
      img.src = url;
      img.style.display = "block";
      img.onerror = () => { img.style.display = "none"; };
    } else {
      img.style.display = "none";
    }
  };

  // ── 글쓰기 ──
  window.goWrite = () => {
    if (!currentUser) { openLoginModal(); return; }
    currentTags = [];
    hide("view-list");
    show("view-write");
    el("write-title").value = "";
    el("write-content").value = "";
    switchTab('write');
    el("write-pw").value = "";
    el("write-pw-confirm").value = "";
    el("tag-input").value = "";
    el("write-error").textContent = "";
    renderWriteTags();
  };
  window.cancelWrite = () => {
    hide("view-write");
    if (editingPostId) {
      editingPostId = null;
      // 수정 취소 시 목록으로
    }
    show("view-list");
    el("write-form-title").textContent = "✏️ 새 글 작성";
    el("submit-btn").textContent = "등록하기";
  };



  // ── 글 열람 ──
  function showPostContent(data) {
    hide("view-pw-check");
    el("detail-title").textContent = data.title;
    el("detail-date").textContent  = formatDate(data.createdAt);
    el("detail-author-wrap").style.display = data.author ? "" : "none";
    el("detail-author").textContent = data.author || "";
    el("detail-content").innerHTML = data.content;
    el("detail-tags").innerHTML = (data.tags || []).map(t => tagBadgeHtml(t, false)).join(" ");
    // 회원이면 수정/삭제 버튼 표시
    el("detail-actions").style.display = currentUser ? "flex" : "none";
    show("view-detail-content");
  }

  window.openPost = async (id) => {
    hide("view-list");
    show("view-detail");
    el("current-post-id").value = id;
    hide("view-detail-content");
    hide("view-pw-check");
    const snap = await getDoc(doc(db, "posts", id));
    if (!snap.exists()) return;
    const data = snap.data();
    // 회원이면 비밀글도 바로 열람
    if (!data.passwordHash || currentUser) {
      showPostContent(data);
    } else {
      // 비회원도 비밀번호 알면 열람 가능
      el("pw-input").value = "";
      el("pw-error").textContent = "";
      show("view-pw-check");
    }
  };

  window.checkPassword = async () => {
    const id = el("current-post-id").value;
    const pw = el("pw-input").value;
    if (!pw) { el("pw-error").textContent = "비밀번호를 입력하세요."; return; }
    const btn = el("pw-check-btn");
    btn.disabled = true; btn.textContent = "확인 중...";
    try {
      const snap = await getDoc(doc(db, "posts", id));
      if (!snap.exists()) { el("pw-error").textContent = "존재하지 않는 글입니다."; return; }
      const data = snap.data();
      if (hashPassword(pw) !== data.passwordHash) {
        el("pw-error").textContent = "비밀번호가 틀렸습니다.";
        btn.disabled = false; btn.textContent = "확인"; return;
      }
      showPostContent(data);
    } catch (e) {
      el("pw-error").textContent = "오류: " + e.message;
    } finally {
      btn.disabled = false; btn.textContent = "확인";
    }
  };

  window.goList = () => { hide("view-detail"); show("view-list"); editingPostId = null; };

  // ── 삭제 ──
  window.deletePost = async () => {
    const id = el("current-post-id").value;
    if (!id || !currentUser) return;
    if (!confirm("정말 이 글을 삭제할까요?")) return;
    try {
      await deleteDoc(doc(db, "posts", id));
      window.goList();
      await loadPosts();
    } catch (e) {
      alert("삭제 실패: " + e.message);
    }
  };

  // ── 수정 모드 진입 ──
  window.startEdit = async () => {
    const id = el("current-post-id").value;
    if (!id || !currentUser) return;
    const snap = await getDoc(doc(db, "posts", id));
    if (!snap.exists()) return;
    const data = snap.data();
    editingPostId = id;
    currentTags = data.tags || [];

    hide("view-detail");
    show("view-write");
    el("write-form-title").textContent = "✏️ 글 수정";
    el("write-title").value = data.title || "";
    el("write-content").value = data.content || "";
    el("write-thumbnail").value = data.thumbnail || "";
    el("write-pw").value = "";
    el("write-pw-confirm").value = "";
    el("tag-input").value = "";
    el("write-error").textContent = "";
    // 썸네일 미리보기
    const img = el("thumb-preview-img");
    if (data.thumbnail) { img.src = data.thumbnail; img.style.display = "block"; }
    else { img.style.display = "none"; }
    renderWriteTags();
    switchTab('write');
  };

  // ── 수정 저장 ──
  window.submitPost = async () => {
    const title   = el("write-title").value.trim();
    const content = el("write-content").value.trim();
    const pw      = el("write-pw").value;
    const pw2     = el("write-pw-confirm").value;
    const errEl   = el("write-error");
    if (!title || !content) { errEl.textContent = "제목과 내용은 필수입니다."; return; }
    if (pw && pw !== pw2)   { errEl.textContent = "비밀번호가 일치하지 않습니다."; return; }
    if (pw && pw.length < 4){ errEl.textContent = "비밀번호는 4자 이상이어야 합니다."; return; }
    const btn = el("submit-btn");
    btn.disabled = true; btn.textContent = editingPostId ? "수정 중..." : "등록 중...";
    errEl.textContent = "";
    try {
      const payload = {
        title, content,
        tags: currentTags,
        author: currentUser.name,
        thumbnail: el("write-thumbnail").value.trim() || null,
      };
      if (pw) payload.passwordHash = hashPassword(pw);

      if (editingPostId) {
        // 수정
        await updateDoc(doc(db, "posts", editingPostId), payload);
        editingPostId = null;
      } else {
        // 신규 등록
        if (!pw) payload.passwordHash = null;
        payload.createdAt = serverTimestamp();
        await addDoc(collection(db, "posts"), payload);
      }
      btn.disabled = false; btn.textContent = "등록하기";
      window.cancelWrite();
      await loadPosts();
    } catch (e) {
      errEl.textContent = "저장 실패: " + e.message;
      btn.disabled = false; btn.textContent = editingPostId ? "수정 완료" : "등록하기";
    }
  };

  document.addEventListener("DOMContentLoaded", () => {
    el("pw-input")?.addEventListener("keydown", e => { if (e.key === "Enter") window.checkPassword(); });
    el("tag-input")?.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); window.addTag(); } });
    el("login-pw")?.addEventListener("keydown", e => { if (e.key === "Enter") window.doLogin(); });
    el("login-modal-overlay")?.addEventListener("click", e => { if (e.target === el("login-modal-overlay")) window.closeLoginModal(); });
    updateHeader();
    loadPosts();
  });
</script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif; background: #f5f0e8; min-height: 100vh; color: #2c2416; }

  /* ── 헤더 ── */
  .site-header { background: #1e1812; color: #f0e8d0; padding: 0 2rem; height: 64px; display: flex; align-items: center; justify-content: space-between; }
  .site-header h1 { font-family: 'Nanum Myeongjo', serif; font-size: 1.25rem; font-weight: 700; letter-spacing: 0.06em; }
  .site-header .subtitle { font-size: 0.75rem; color: #8c7a5e; margin-top: 2px; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .header-login-btn { display: flex; align-items: center; gap: 6px; background: transparent; border: 1px solid #4a3e30; color: #c8b898; border-radius: 6px; padding: 6px 14px; font-size: 0.82rem; font-family: 'Pretendard', sans-serif; cursor: pointer; transition: background 0.15s; }
  .header-login-btn:hover { background: #2e2418; }
  #header-user-info { display: none; align-items: center; gap: 10px; }
  .header-user-name { font-size: 0.82rem; color: #c8b898; }
  .header-logout-btn { background: transparent; border: 1px solid #4a3e30; color: #8c7a5e; border-radius: 6px; padding: 5px 12px; font-size: 0.78rem; font-family: 'Pretendard', sans-serif; cursor: pointer; transition: background 0.15s; }
  .header-logout-btn:hover { background: #2e2418; color: #c8b898; }

  /* ── 로그인 모달 ── */
  #login-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 100; align-items: center; justify-content: center; }
  .login-modal { background: #fffdf8; border-radius: 12px; border: 1px solid #d8cebc; padding: 2rem; width: 340px; max-width: calc(100vw - 2rem); }

  .login-modal-close { position: absolute; top: 1rem; right: 1rem; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: #9c8870; line-height: 1; }
  .login-modal-wrap { position: relative; }
  #login-error { color: #c0392b; font-size: 0.82rem; margin-top: 0.6rem; min-height: 1.2em; }

  /* ── 컨테이너 ── */
  .container { max-width: 780px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
  .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }

  /* ── 태그 필터 ── */

  .tag-filter-label { font-size: 0.75rem; color: #9c8870; font-weight: 600; letter-spacing: 0.04em; }

  /* ── 버튼 ── */
  .btn { cursor: pointer; border: none; border-radius: 6px; font-family: 'Pretendard', sans-serif; font-size: 0.875rem; font-weight: 500; padding: 0.5rem 1.1rem; transition: background 0.15s, transform 0.1s; }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: #1e1812; color: #f0e8d0; }
  .btn-primary:hover { background: #3a2e22; }
  .btn-primary:disabled { background: #aaa; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: #5a4a35; border: 1px solid #c8b89a; }
  .btn-ghost:hover { background: #e8dfd0; }

  /* ── 게시판 ── */
  .board-card { background: #fffdf8; border: 1px solid #d8cebc; border-radius: 10px; overflow: hidden; }
  .board-header-row { display: grid; grid-template-columns: 40px 24px 1fr 90px; gap: 8px; align-items: center; padding: 0.6rem 1.1rem; background: #f0e8d4; border-bottom: 1px solid #d8cebc; font-size: 0.75rem; font-weight: 600; color: #7a6848; text-transform: uppercase; letter-spacing: 0.04em; }
  .post-row { display: grid; grid-template-columns: 40px 24px 1fr 90px; gap: 8px; align-items: center; padding: 0.75rem 1.1rem; border-bottom: 1px solid #ede5d5; font-size: 0.875rem; transition: background 0.12s; }
  .post-row:last-child { border-bottom: none; }

  .post-row.locked-row { cursor: pointer; opacity: 0.7; }
  .post-row.locked-row:hover { background: #f9f5ee; }
  .post-num { color: #9c8870; font-size: 0.78rem; text-align: center; }

  .post-title-wrap { display: flex; flex-direction: column; gap: 4px; overflow: hidden; }
  .post-title-text { font-weight: 500; color: #1e1812; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .post-tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .post-date { font-size: 0.78rem; color: #9c8870; text-align: right; }
  #list-loading { padding: 2.5rem; display: flex; justify-content: center; align-items: center; color: #9c8870; font-size: 0.875rem; gap: 8px; }
  .empty-state { padding: 3rem; text-align: center; color: #9c8870; }
  .empty-state .lock-icon { font-size: 2rem; display: block; margin-bottom: 0.75rem; }

  /* 뷰 전환 토글 */
  .view-toggle { display: flex; border: 1px solid #d0c4ae; border-radius: 6px; overflow: hidden; }
  .view-toggle-btn { background: #fffdf8; border: none; padding: 6px 12px; font-size: 1rem; cursor: pointer; color: #9c8870; transition: background 0.15s, color 0.15s; line-height: 1; }
  .view-toggle-btn:hover { background: #f0e8d4; }
  .view-toggle-btn.active { background: #1e1812; color: #f0e8d0; }

  /* 썸네일 그리드 */
  .thumb-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 16px; }
  .thumb-card { background: #fff; border: 1px solid #ede5d5; border-radius: 10px; overflow: hidden; transition: box-shadow 0.15s, transform 0.15s; display: flex; flex-direction: column; }
  .thumb-card.clickable { cursor: pointer; }
  .thumb-card.clickable:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.10); transform: translateY(-2px); }
  .thumb-card.locked-row { cursor: pointer; opacity: 0.75; }
  .thumb-img-wrap { width: 100%; aspect-ratio: 16/9; background: #f0ebe0; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .thumb-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb-no-img { font-size: 2rem; color: #c8b898; }
  .thumb-body { padding: 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .thumb-title { font-weight: 600; font-size: 0.9rem; color: #1e1812; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .thumb-excerpt { font-size: 0.78rem; color: #7a6848; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; flex: 1; }
  .thumb-footer { display: flex; align-items: flex-end; justify-content: space-between; gap: 4px; margin-top: 4px; }
  .thumb-date { font-size: 0.72rem; color: #b0a08a; white-space: nowrap; }

  @media (max-width: 640px) { .thumb-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px; } }
  @media (max-width: 400px) { .thumb-grid { grid-template-columns: 1fr; } }

  /* 로그인 안내 배너 */
  .login-notice { display: flex; align-items: center; gap: 10px; background: #fef8ee; border: 1px solid #f0d9a0; border-radius: 8px; padding: 0.75rem 1rem; margin-bottom: 1rem; font-size: 0.85rem; color: #7a5a10; }
  .login-notice a { color: #5a3e0a; font-weight: 600; cursor: pointer; text-decoration: underline; }

  /* ── 폼 공통 ── */
  #view-write { display: none; }
  .form-card { background: #fffdf8; border: 1px solid #d8cebc; border-radius: 10px; padding: 1.75rem; }
  .form-title { font-family: 'Nanum Myeongjo', serif; font-size: 1.1rem; font-weight: 700; margin-bottom: 1.5rem; color: #1e1812; }
  .form-group { margin-bottom: 1.1rem; }
  .form-label { display: block; font-size: 0.78rem; font-weight: 600; color: #7a6848; margin-bottom: 0.4rem; letter-spacing: 0.04em; text-transform: uppercase; }
  .form-input, .form-textarea { width: 100%; border: 1px solid #d0c4ae; border-radius: 6px; padding: 0.6rem 0.85rem; font-family: 'Pretendard', sans-serif; font-size: 0.9rem; color: #1e1812; background: #fff; outline: none; transition: border-color 0.15s, box-shadow 0.15s; }
  .form-input:focus, .form-textarea:focus { border-color: #8c6e45; box-shadow: 0 0 0 3px rgba(140,110,69,0.12); }
  .form-textarea { resize: vertical; min-height: 140px; line-height: 1.6; }
  .html-editor { font-family: 'Consolas', 'Monaco', monospace; font-size: 0.85rem; min-height: 180px; }
  .editor-tabs { display: flex; align-items: center; gap: 4px; margin-bottom: -1px; }
  .editor-tab { background: #f0ebe0; border: 1px solid #d0c4ae; border-bottom: none; border-radius: 6px 6px 0 0; padding: 5px 14px; font-size: 0.8rem; font-family: 'Pretendard', sans-serif; color: #7a6848; cursor: pointer; transition: background 0.15s; }
  .editor-tab.active { background: #fff; color: #1e1812; font-weight: 600; }
  .editor-tab:hover:not(.active) { background: #e8dfd0; }
  .editor-tab-hint { margin-left: auto; font-size: 0.72rem; color: #b0a08a; }
  #editor-write-area .form-textarea { border-radius: 0 6px 6px 6px; }
  .html-preview-box { border: 1px solid #d0c4ae; border-radius: 0 6px 6px 6px; padding: 1rem; min-height: 180px; background: #fff; font-size: 0.9rem; line-height: 1.75; color: #2c2416; overflow-x: auto; }
  .html-preview-box img { max-width: 100%; height: auto; border-radius: 4px; }
  .html-preview-box a { color: #1a6fa8; }
  .html-preview-box table { border-collapse: collapse; width: 100%; }
  .html-preview-box td, .html-preview-box th { border: 1px solid #d0c4ae; padding: 6px 10px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-notice { font-size: 0.78rem; color: #9c8870; margin-top: 0.35rem; }
  .form-error { color: #c0392b; font-size: 0.82rem; margin-top: 0.75rem; min-height: 1.2em; }
  .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 1.5rem; }
  .tag-input-row { display: flex; gap: 8px; }
  .thumb-url-row { display: flex; gap: 8px; }
  .tag-input-row .form-input { flex: 1; }
  .btn-tag-add { background: #f0e8d4; color: #5a4a35; border: 1px solid #c8b89a; border-radius: 6px; padding: 0 14px; font-size: 0.85rem; font-weight: 600; cursor: pointer; white-space: nowrap; transition: background 0.15s; }
  .btn-tag-add:hover { background: #e0d4bc; }
  #write-tags-display { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; min-height: 28px; }

  /* ── 글 상세 ── */
  #view-detail { display: none; }
  .detail-card { background: #fffdf8; border: 1px solid #d8cebc; border-radius: 10px; overflow: hidden; }
  .detail-header { padding: 1.4rem 1.6rem 1rem; border-bottom: 1px solid #ede5d5; }
  .detail-header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
  .detail-back { font-size: 0.78rem; color: #9c8870; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
  .detail-back:hover { color: #5a4a35; }
  #detail-actions { display: flex; gap: 8px; }
  .btn-edit { background: #f0e8d4; color: #5a4a35; border: 1px solid #c8b89a; border-radius: 6px; padding: 5px 14px; font-size: 0.82rem; font-family: 'Pretendard', sans-serif; cursor: pointer; transition: background 0.15s; }
  .btn-edit:hover { background: #e0d4bc; }
  .btn-delete { background: #fdeaea; color: #a02020; border: 1px solid #f0a0a0; border-radius: 6px; padding: 5px 14px; font-size: 0.82rem; font-family: 'Pretendard', sans-serif; cursor: pointer; transition: background 0.15s; }
  .btn-delete:hover { background: #f5d0d0; }
  .detail-title-text { font-family: 'Nanum Myeongjo', serif; font-size: 1.35rem; font-weight: 700; color: #1e1812; margin-bottom: 0.6rem; }
  .detail-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 0.8rem; color: #9c8870; }
  #detail-tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .detail-body { padding: 1.6rem; font-size: 0.95rem; line-height: 1.85; color: #2c2416; min-height: 120px; }
  .detail-body img { max-width: 100%; height: auto; border-radius: 6px; margin: 4px 0; }
  .detail-body a { color: #1a6fa8; }
  .detail-body table { border-collapse: collapse; width: 100%; }
  .detail-body td, .detail-body th { border: 1px solid #d0c4ae; padding: 6px 10px; }
  .detail-body b, .detail-body strong { font-weight: 700; }
  .detail-body i, .detail-body em { font-style: italic; }
  .detail-body ul, .detail-body ol { padding-left: 1.5rem; }

  /* ── 비밀번호 패널 ── */
  .pw-panel { padding: 2.5rem 1.6rem; text-align: center; }
  .pw-panel .lock-big { font-size: 2.5rem; margin-bottom: 0.75rem; }
  .pw-panel h3 { font-family: 'Nanum Myeongjo', serif; font-size: 1.05rem; color: #1e1812; margin-bottom: 0.4rem; }
  .pw-panel p { font-size: 0.82rem; color: #9c8870; margin-bottom: 1.5rem; }
  .pw-row { display: flex; gap: 8px; max-width: 340px; margin: 0 auto; }
  .pw-row .form-input { flex: 1; }
  #pw-error { margin-top: 0.6rem; font-size: 0.82rem; color: #c0392b; min-height: 1.2em; }
  #current-post-id { display: none; }

  @media (max-width: 560px) {
    .board-header-row, .post-row { grid-template-columns: 32px 20px 1fr 70px; }
    .form-row { grid-template-columns: 1fr; }
    .site-header { padding: 0 1rem; }
  }
</style>
</head>
<body>

<!-- 헤더 -->
<header class="site-header">
  <div>
    <h1>📋 비밀글 게시판</h1>
    <div class="subtitle">Secret Board — Firebase Firestore</div>
  </div>
  <div class="header-right">
    <button id="header-login-btn" class="header-login-btn" onclick="openLoginModal()">🔑 로그인</button>
    <div id="header-user-info">
      <span class="header-user-name" id="header-user-name"></span>
      <button class="header-logout-btn" onclick="doLogout()">로그아웃</button>
    </div>
  </div>
</header>

<!-- 로그인 모달 -->
<div id="login-modal-overlay">
  <div class="login-modal login-modal-wrap">
    <div class="login-modal-title">🔑 회원 로그인</div>
    <div class="form-group">
      <label class="form-label">아이디</label>
      <input id="login-id" class="form-input" type="text" placeholder="아이디 입력" maxlength="30">
    </div>
    <div class="form-group">
      <label class="form-label">비밀번호</label>
      <input id="login-pw" class="form-input" type="password" placeholder="비밀번호 입력" maxlength="30">
    </div>
    <div id="login-error"></div>
    <div class="form-actions" style="margin-top:1.25rem">
      <button class="btn btn-ghost" onclick="closeLoginModal()">취소</button>
      <button id="login-submit-btn" class="btn btn-primary" onclick="doLogin()">로그인</button>
    </div>
  </div>
</div>

<div class="container">

  <!-- 목록 뷰 -->
  <div id="view-list">
    <div class="toolbar">
      <span class="toolbar-title">전체 글</span>
      <div style="display:flex;align-items:center;gap:8px;">
        <div class="view-toggle">
          <button id="view-btn-list" class="view-toggle-btn active" onclick="setViewMode('list')" title="목록 보기">☰</button>
          <button id="view-btn-thumb" class="view-toggle-btn" onclick="setViewMode('thumb')" title="썸네일 보기">⊞</button>
        </div>
        <button id="write-btn" class="btn btn-primary" onclick="goWrite()" style="display:none">✏️ 글쓰기</button>
      </div>
    </div>
    <div id="tag-filter-wrap"></div>
    <div class="board-card">
      <div class="board-header-row" id="board-header-row">
        <span style="text-align:center">번호</span>
        <span></span>
        <span>제목 / 태그</span>
        <span style="text-align:right">날짜</span>
      </div>
      <div id="list-loading" style="display:flex"><span>⏳ 불러오는 중...</span></div>
      <div id="post-list"></div>
    </div>
  </div>

  <!-- 글쓰기 뷰 -->
  <div id="view-write">
    <div class="form-card">
      <div class="form-title" id="write-form-title">✏️ 새 글 작성</div>
      <div class="form-group">
        <label class="form-label">제목</label>
        <input id="write-title" class="form-input" type="text" placeholder="글 제목을 입력하세요" maxlength="100">
      </div>
      <div class="form-group">
        <label class="form-label">내용</label>
        <div class="editor-tabs">
          <button class="editor-tab active" onclick="switchTab('write')" id="tab-write">✏️ 작성</button>
          <button class="editor-tab" onclick="switchTab('preview')" id="tab-preview">👁 미리보기</button>
          <span class="editor-tab-hint">HTML 태그 사용 가능</span>
        </div>
        <div id="editor-write-area">
          <textarea id="write-content" class="form-textarea html-editor" placeholder="내용을 입력하세요&#10;&#10;HTML 태그를 직접 사용할 수 있어요. 예시:&#10;&lt;b&gt;굵게&lt;/b&gt;, &lt;i&gt;기울임&lt;/i&gt;&#10;&lt;img src=&quot;URL&quot; style=&quot;max-width:100%&quot;&gt;&#10;&lt;a href=&quot;URL&quot;&gt;링크&lt;/a&gt;"></textarea>
        </div>
        <div id="editor-preview-area" style="display:none">
          <div id="html-preview" class="html-preview-box"></div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">썸네일 이미지 <span style="font-weight:400;color:#b0a08a">(선택 · 이미지 URL)</span></label>
        <div class="thumb-url-row">
          <input id="write-thumbnail" class="form-input" type="url" placeholder="https://example.com/image.jpg" oninput="previewThumbnail()">
        </div>
        <img id="thumb-preview-img" src="" alt="썸네일 미리보기" style="display:none;margin-top:8px;max-height:160px;border-radius:6px;border:1px solid #d0c4ae;object-fit:cover;max-width:100%;" onerror="this.style.display='none'">
        <div class="form-notice">입력한 URL 이미지가 썸네일로 사용됩니다. 비워두면 본문 첫 이미지가 자동 사용돼요.</div>
      </div>
      <div class="form-group">
        <label class="form-label">태그 <span style="font-weight:400;color:#b0a08a">(선택 · 최대 5개)</span></label>
        <div class="tag-input-row">
          <input id="tag-input" class="form-input" type="text" placeholder="태그 입력 후 Enter 또는 추가 클릭" maxlength="20">
          <button class="btn-tag-add" onclick="addTag()">+ 추가</button>
        </div>
        <div id="write-tags-display"></div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">비밀번호 <span style="font-weight:400;color:#b0a08a">(선택)</span></label>
          <input id="write-pw" class="form-input" type="password" placeholder="비워두면 회원 전체 열람 가능" maxlength="20">
          <div class="form-notice">설정 시 비밀번호를 알아야 열람해요 (회원 제외)</div>
        </div>
        <div class="form-group">
          <label class="form-label">비밀번호 확인</label>
          <input id="write-pw-confirm" class="form-input" type="password" placeholder="동일하게 입력" maxlength="20">
        </div>
      </div>
      <div id="write-error" class="form-error"></div>
      <div class="form-actions">
        <button class="btn btn-ghost" onclick="cancelWrite()">취소</button>
        <button id="submit-btn" class="btn btn-primary" onclick="submitPost()">등록하기</button>
      </div>
    </div>
  </div>

  <!-- 상세 뷰 -->
  <div id="view-detail">
    <div class="detail-card">
      <div id="view-pw-check" class="pw-panel">
        <div class="lock-big">🔒</div>
        <h3>비밀글입니다</h3>
        <p>비밀번호를 입력하면 내용을 확인할 수 있습니다<br><span style="font-size:0.78rem;color:#b0a08a">회원 로그인 시 비밀번호 없이 열람 가능해요</span></p>
        <div class="pw-row">
          <input id="pw-input" class="form-input" type="password" placeholder="비밀번호 입력" maxlength="20">
          <button id="pw-check-btn" class="btn btn-primary" onclick="checkPassword()">확인</button>
        </div>
        <div id="pw-error"></div>
        <input type="hidden" id="current-post-id">
        <div style="margin-top:1.5rem">
          <span class="detail-back" onclick="goList()">← 목록으로</span>
        </div>
      </div>
      <div id="view-detail-content" style="display:none">
        <div class="detail-header">
          <div class="detail-header-top">
            <div class="detail-back" onclick="goList()">← 목록으로</div>
            <div id="detail-actions" style="display:none">
              <button class="btn-edit" onclick="startEdit()">✏️ 수정</button>
              <button class="btn-delete" onclick="deletePost()">🗑 삭제</button>
            </div>
          </div>
          <div class="detail-title-text" id="detail-title"></div>
          <div class="detail-meta">
            <span id="detail-author-wrap">✍️ <span id="detail-author"></span></span>
            <span>📅 <span id="detail-date"></span></span>
            <div id="detail-tags"></div>
          </div>
        </div>
        <div class="detail-body" id="detail-content"></div>
      </div>
    </div>
  </div>

</div>
</body>
</html>
